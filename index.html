<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LojaCarro</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>LojaCarro</h1>

    <section>
        <h2>Usuário</h2>

        <select id="usuario">
            <option value="">Selecione um usuário</option>
        </select>

        <p id="usuarioSelecionado"></p>
    </section>

    <section>
        <h2>Cadastro de Carro</h2>

        <input type="hidden" id="carroId">

        <input
            type="text"
            id="modelo"
            placeholder="Modelo"
        >

        <input
            type="number"
            id="ano"
            placeholder="Ano"
        >

        <input
            type="number"
            id="preco"
            placeholder="Preço"
            step="0.01"
        >

        <button onclick="salvarCarro()">
            Salvar
        </button>

        <button onclick="limparFormulario()">
            Limpar
        </button>
    </section>

    <section>
        <h2>Carros</h2>

        <button onclick="listarCarros()">
            Atualizar lista
        </button>

        <div id="listaCarros"></div>
    </section>

    <section>
        <h2>Logs</h2>

        <button onclick="listarLogs()">
            Atualizar logs
        </button>

        <div id="listaLogs"></div>
    </section>

    <script src="js/app.js"></script>

</body>
</html>
